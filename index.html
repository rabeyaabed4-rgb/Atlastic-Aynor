    <script>
      (function () {
        try {
          if (typeof window !== 'undefined' && 'fetch' in window) {
            var _nativeFetch = window.fetch.bind(window);
            var _currentFetch = _nativeFetch;
            Object.defineProperty(window, 'fetch', {
              get: function () {
                return _currentFetch;
              },
              set: function (newFetch) {
                _currentFetch = typeof newFetch === 'function' ? newFetch : _nativeFetch;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (e) {
          // Ignore if environment forbids redefining fetch
